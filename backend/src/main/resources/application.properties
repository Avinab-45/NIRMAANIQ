# ===================================================================
# Construction Intelligence Backend Configuration
# ===================================================================
spring.application.name=construction-backend
server.port=${SERVER_PORT:8080}

# Database Connection (Supabase PostgreSQL)
# Requirement: ddl-auto must be validate
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Supabase Auth / Spring Security OAuth2 Resource Server
# Standard Supabase JWKS endpoint for asymmetric signature validation
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SUPABASE_JWKS_URL:https://placeholder.supabase.co/auth/v1/.well-known/jwks.json}

# Supabase Custom Settings
app.supabase.url=${SUPABASE_URL:https://placeholder.supabase.co}
app.supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:placeholder-service-key}
app.supabase.storage-bucket=${SUPABASE_STORAGE_BUCKET:construction-media}

# Email Service Configuration (Contractor OTP & System Notifications)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
app.mail.from=${MAIL_FROM:noreply@nirmaaniq.com}

# Security & Business Logic Properties
# Requirement: BUILDER_ACTIVATION_CODE must be explicitly supplied in the environment
app.builder.activation-code=${BUILDER_ACTIVATION_CODE:}
app.contractor.otp.expiry-minutes=5
app.contractor.otp.max-attempts=5
app.contractor.otp.resend-interval-seconds=60

# CORS Allowed Origins (Comma-separated trusted frontend origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

# AI Provider Settings
app.ai.enabled=${AI_PROVIDER_ENABLED:false}
app.ai.api-key=${AI_PROVIDER_API_KEY:}

# YOLO11 FastAPI ML Service Configuration
app.ml.enabled=${ML_SERVICE_ENABLED:true}
app.ml.url=${ML_SERVICE_URL:http://localhost:8000}
app.ml.api-key=${ML_SERVICE_API_KEY:}
app.ml.predict-endpoint=${ML_SERVICE_PREDICT_ENDPOINT:/predict}
app.ml.connect-timeout-seconds=${ML_SERVICE_CONNECT_TIMEOUT:5}
app.ml.read-timeout-seconds=${ML_SERVICE_READ_TIMEOUT:30}
app.ml.file-param-name=${ML_SERVICE_FILE_PARAM_NAME:file}

# Multipart File Upload Limits (Media & Site Documents)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
