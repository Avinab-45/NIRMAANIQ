# Test configuration using in-memory H2 in PostgreSQL compatibility mode
spring.application.name=construction-backend-test

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Avoid external network calls during tests
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://placeholder.supabase.co/auth/v1/.well-known/jwks.json

app.supabase.url=https://placeholder.supabase.co
app.supabase.service-role-key=test-service-key-12345
app.supabase.storage-bucket=construction-media
app.mail.from=noreply@nirmaaniq.com

app.builder.activation-code=TEST-BUILDER-SECRET-KEY-2026
app.contractor.otp.expiry-minutes=5
app.contractor.otp.max-attempts=5
app.contractor.otp.resend-interval-seconds=60

app.ai.enabled=false
app.ai.api-key=
